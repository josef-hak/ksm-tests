# Values for the KCM chart under test.
#
# Rendered by scripts/deploy_kcm.sh via envsubst. In release mode the image
# block is dropped, so the chart's published defaults apply.
#
# The three create* switches are the important part: they turn off the
# controller's "bootstrap everything from the chart" behaviour so this project
# can apply a trimmed Release, a trimmed Management and only the templates the
# scenario actually needs. Without that, KCM would reconcile all eleven
# providers on every run.
# NOTE: envsubst also expands variables inside comments -- keep them out.
controller:
  createManagement: false
  createRelease: false
  createTemplates: false
  # Which state management adapter runs. All three are built into the
  # controller; KSM_PROVIDER picks one and common.sh renders the set from it.
  enableSveltosCtrl: ${KCM_ENABLE_SVELTOS_CTRL}
  enableArgoCDCtrl: ${KCM_ENABLE_ARGOCD_CTRL}
  enableFluxCtrl: ${KCM_ENABLE_FLUX_CTRL}
  # What a ClusterDeployment or MultiClusterService that names no provider
  # gets. The scenarios all name one; this covers a ClusterDeployment's own
  # serviceSpec, so a run is entirely on one adapter.
  defaultStateManagementProvider: ${KSM_PROVIDER_NAME}
  templatesRepoURL: ${TEMPLATES_REPO_URL}
  insecureRegistry: ${INSECURE_REGISTRY}
  defaultHelmTimeout: 20m
  logger:
    devel: true

regional:
  telemetry:
    mode: disabled
