# Overlay merged on top of kcm-values.yaml when KSM_PROVIDER=ksm-flux.
#
# The adapter is opt-in in the chart: without enableFluxCtrl there is no
# ksm-flux StateManagementProvider for the MultiClusterServices to name, and
# every ServiceSet would sit unreconciled.
#
# defaultStateManagementProvider covers what the scenarios do not name
# themselves -- a ClusterDeployment's own serviceSpec -- so a run is entirely
# on one adapter.
controller:
  enableFluxCtrl: true
  defaultStateManagementProvider: ksm-flux
