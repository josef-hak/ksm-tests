name: 201_svcdep
group: Service dependencies
description: >-
  A valid dependsOn chain: cert-manager provides the webhook certificates, the
  CRDs must exist before the controller. Same chain as catalog's apps/kserve.
  Issue #2, scenario 1: every service is valid, so all of them must land.

# KNOWN FAILURE in "Remove services" on some KCM builds: teardown removes
# kserve-crd before uninstalling kserve-resources, whose release still holds a
# ClusterStorageContainer, so the uninstall fails with "ensure CRDs are
# installed first", the ClusterSummary never goes, and the MCS finalizer never
# clears. The MultiClusterService is still there eleven minutes later, so no
# timeout saves it.
#
# Seen on 1.12.0-rc.3. Not on main, nor on the staging build in
# kcm-variants.yaml, where this scenario tears down cleanly -- so it is a
# property of the build under test, not of the scenario.

# Charts come from k0rdent/catalog's registry. Those are thin wrappers that
# declare the upstream chart as a dependency of the same name, so values are
# nested one level under that name, exactly as catalog's own example does.
services:
  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    waitForPods: cert-manager-
    # A cluster of its own has no cert-manager, so this copy has to bring the
    # CRDs: kserve-resources renders a Certificate and an Issuer, and without
    # them its release never installs.
    values: |
      cert-manager:
        crds:
          enabled: true
    # Under self-management KCM runs its own cert-manager in this very cluster
    # and its helm release owns the CRDs, so this copy must not install them
    # and needs names of its own.
    valuesTestModeSelf: |
      cert-manager:
        crds:
          enabled: false
        fullnameOverride: scenario-cert-manager

  - name: kserve-crd
    chart: kserve-crd
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: cert-manager

  - name: kserve-resources
    chart: kserve-resources
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: kserve-crd
    waitForPods: kserve-controller-manager-
    values: |
      kserve-resources:
        kserve:
          controller:
            deploymentMode: Standard
            gateway:
              disableIstioVirtualHost: true
              disableIngressCreation: true
